                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);

                                                    onChange={(e)=>setNewItemDesc(e.target.value)}
                                                    placeholder="وصف تفصيلي للتصميم..."
                                                    className="w-full p-2 rounded-lg bg-zinc-50 border border-zinc-300 text-xs text-black resize-none"
                                                ></textarea>
                                            </div>

                                            <button type="submit" className="w-full py-2.5 rounded-xl bw-btn-primary font-bold text-xs mt-2">
                                                حفظ ونشر التصميم في المعرض
                                            </button>
                                        </form>

                                        {/* List of Portfolio items with delete options */}
                                        <div className="mt-5 pt-4 border-t border-zinc-200">
                                            <h4 className="text-xs font-bold text-black mb-2">التصاميم الحالية ({portfolio.length})</h4>
                                            <div className="space-y-2 max-h-40 overflow-y-auto">
                                                {portfolio.map((item) => (
                                                    <div key={item.id} className="flex items-center justify-between p-2 rounded-lg bg-zinc-50 border border-zinc-200">
                                                        <div className="flex items-center gap-2">
                                                            <img src={item.image} alt={item.title} className="w-7 h-7 rounded object-cover" />
                                                            <span className="text-[11px] font-bold text-black truncate max-w-[150px]">{item.title}</span>
                                                        </div>
                                                        <button 
                                                            onClick={() => handleDeletePortfolio(item.id)}
                                                            className="text-red-600 text-[10px] font-bold hover:underline"
                                                        >
                                                            حذف
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Modal Details */}
                    {selectedService && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                            <div className="bw-card rounded-2xl p-5 max-w-sm w-full relative">
                                <button onClick={() => triggerAction(() => setSelectedService(null))} className="absolute top-4 left-4 text-zinc-400 hover:text-black">
                                    <i data-lucide="x" className="w-4 h-4"></i>
                                </button>
                                <h3 className="text-sm font-bold text-black mb-1">{selectedService.title}</h3>
                                <p className="text-zinc-600 text-xs mb-3">{selectedService.description}</p>
                                <div className="p-2.5 rounded-xl bg-zinc-50 border border-zinc-200 flex justify-between items-center mb-3">
                                    <span className="text-sm font-black text-black">{selectedService.price} ج.م</span>
                                    <span className="text-[10px] text-zinc-500 font-medium">{selectedService.delivery}</span>
                                </div>
                                <button onClick={() => triggerAction(() => { setSelectedService(null); openMessenger(); })} className="w-full py-2 rounded-xl bw-btn-primary font-bold text-xs flex items-center justify-center gap-1.5">
                                    <i data-lucide="message-square" className="w-3.5 h-3.5"></i> طلب عبر ماسنجر
                                </button>
                            </div>
                        </div>
                    )}

                    {selectedPortfolio && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                            <div className="bw-card rounded-2xl p-4 max-w-sm w-full relative">
                                <button onClick={() => triggerAction(() => setSelectedPortfolio(null))} className="absolute top-3 left-3 text-zinc-400 hover:text-black z-10">
                                    <i data-lucide="x" className="w-4 h-4"></i>
                                </button>
                                <div className="w-full aspect-square rounded-lg overflow-hidden bg-zinc-100 mb-2">
                                    <img src={selectedPortfolio.image} alt={selectedPortfolio.title} className="w-full h-full object-cover" />
                                </div>
                                <h3 className="text-xs font-bold text-black mb-1">{selectedPortfolio.title}</h3>
                                <p className="text-zinc-600 text-[11px] mb-3">{selectedPortfolio.desc}</p>
                                <button onClick={() => triggerAction(() => { setSelectedPortfolio(null); openMessenger(); })} className="w-full py-2 rounded-xl bw-btn-primary font-bold text-xs flex items-center justify-center gap-1.5">
                                    <i data-lucide="message-square" className="w-3.5 h-3.5"></i> طلب تصميم مماثل
                                </button>
                            </div>
                        </div>
                    )}

                    {showSuccessModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                            <div className="bw-card rounded-2xl p-5 max-w-xs w-full text-center">
                                <div className="w-9 h-9 bg-black text-white rounded-full flex items-center justify-center mx-auto mb-2">
                                    <i data-lucide="check" className="w-4 h-4"></i>
                                </div>
                                <h3 className="text-sm font-bold text-black mb-1">تم تجهيز طلبك!</h3>
                                <p className="text-zinc-600 text-xs mb-4">شكراً لك، تم تحويل بياناتك للمتابعة.</p>
                                <button onClick={() => triggerAction(() => setShowSuccessModal(false))} className="w-full py-2 rounded-xl bw-btn-primary font-bold text-xs">
                                    حسناً
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
    </script>
</body>
  </html>
