<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ES Agency | المعرض الرقمي</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // تهيئة مشروع Firebase الخاص بـ ES Agency
        const firebaseConfig = {
            apiKey: "AIzaSyBtb1AWsU_tkIHmNXpNM4fn3GuA8sFL3Hc",
            authDomain: "es-agency.firebaseapp.com",
            projectId: "es-agency",
            storageBucket: "es-agency.firebasestorage.app",
            messagingSenderId: "959579365438",
            appId: "1:959579365438:web:6c2eb7079ef6fdb168316f",
            measurementId: "G-YBR2NFC78F"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const storage = firebase.storage();

        function MainApp() {
            const [portfolio, setPortfolio] = useState([]);
            const [loading, setLoading] = useState(true);
            const [uploading, setUploading] = useState(false);
            const [filter, setFilter] = useState('all');

            // حالة المشرف والرمز السري
            const [isAdminOpen, setIsAdminOpen] = useState(false);
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [passcode, setPasscode] = useState('');

            // حالة إضافة تصميم جديد
            const [newItemTitle, setNewItemTitle] = useState('');
            const [newItemCategory, setNewItemCategory] = useState('تصميم');
            const [newItemDesc, setNewItemDesc] = useState('');
            const [selectedFile, setSelectedFile] = useState(null);

            // جلب البيانات لحظياً من Firebase Firestore
            useEffect(() => {
                const unsubscribe = db.collection("portfolio")
                    .orderBy("createdAt", "desc")
                    .onSnapshot((snapshot) => {
                        const docs = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setPortfolio(docs);
                        setLoading(false);
                    }, (error) => {
                        console.error("خطأ جلب البيانات:", error);
                        setLoading(false);
                    });

                return () => unsubscribe();
            }, []);

            // إعادة رسم أيقونات Lucide
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [portfolio, isAdminOpen, isAuthenticated, filter, loading]);

            // التحقق من الرمز السري
            const handleAdminLogin = (e) => {
                e.preventDefault();
                // يمكن تغيير كلمة المرور هنا
                if (passcode === "12345" || passcode === "ES2026") {
                    setIsAuthenticated(true);
                    setPasscode('');
                } else {
                    alert("رمز المرور غير صحيح!");
                }
            };

            const handleImageFileChange = (e) => {
                if (e.target.files[0]) {
                    setSelectedFile(e.target.files[0]);
                }
            };

            // رفع الصورة للسحابة وحفظ التغيرات
            const handleAddPortfolio = async (e) => {
                e.preventDefault();
                if (!newItemTitle || !selectedFile) {
                    return alert("يرجى اختيار صورة واختيار عنوان للتصميم!");
                }

                setUploading(true);
                try {
                    // 1. رفع الصورة لـ Storage
                    const fileRef = storage.ref(`portfolio/${Date.now()}_${selectedFile.name}`);
                    await fileRef.put(selectedFile);
                    const imageUrl = await fileRef.getDownloadURL();

                    // 2. تسجيل البيانات في Firestore
                    await db.collection("portfolio").add({
                        title: newItemTitle,
                        category: newItemCategory,
                        desc: newItemDesc || "",
                        image: imageUrl,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert("تم رفع التصميم وحفظه بنجاح في السحابة!");
                    setNewItemTitle('');
                    setNewItemDesc('');
                    setSelectedFile(null);
                    setIsAdminOpen(false);
                } catch (err) {
                    console.error("خطأ أثناء الرفع:", err);
                    alert("حدث خطأ أثناء رفع التصميم!");
                } finally {
                    setUploading(false);
                }
            };

            // حذف تصميم
            const handleDeleteItem = async (id) => {
                if (!confirm("هل أنت تأكد من رغبتك في حذف هذا التصميم؟")) return;
                try {
                    await db.collection("portfolio").doc(id).delete();
                } catch (err) {
                    alert("حدث خطأ أثناء الحذف!");
                }
            };

            const filteredPortfolio = filter === 'all' 
                ? portfolio 
                : portfolio.filter(item => item.category === filter);

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    {/* Header */}
                    <header className="bg-white border-b border-gray-200 sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="w-9 h-9 bg-black text-white font-bold flex items-center justify-center rounded-lg text-lg">
                                    ES
                                </div>
                                <span className="font-bold text-xl tracking-tight">ES Agency</span>
                            </div>

                            <button 
                                onClick={() => setIsAdminOpen(true)}
                                className="flex items-center gap-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs transition-all font-medium"
                            >
                                <i data-lucide={isAuthenticated ? "unlock" : "lock"} className="w-3.5 h-3.5"></i>
                                <span>{isAuthenticated ? "لوحة التحكم" : "رمز المرور"}</span>
                            </button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
                        <div className="text-center my-8">
                            <h1 className="text-3xl md:text-5xl font-extrabold text-gray-900 mb-3">معرض الأعمال والتصاميم</h1>
                            <p className="text-gray-500 max-w-xl mx-auto text-sm md:text-base">نبتكر الهويات البصرية والحلول البرمجية بأعلى معايير الإبداع.</p>
                        </div>

                        {/* Filter Buttons */}
                        <div className="flex items-center justify-center gap-2 mb-8 flex-wrap">
                            {['all', 'تصميم', 'برمجة', 'فيديو'].map((cat) => (
                                <button
                                    key={cat}
                                    onClick={() => setFilter(cat)}
                                    className={`px-4 py-1.5 rounded-full text-xs font-semibold transition-all ${
                                        filter === cat 
                                        ? 'bg-black text-white shadow-md' 
                                        : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'
                                    }`}
                                >
                                    {cat === 'all' ? 'الكل' : cat}
                                </button>
                            ))}
                        </div>

                        {/* Portfolio Cards */}
                        {loading ? (
                            <div className="text-center py-20">
                                <div className="inline-block animate-spin rounded-full h-8 w-8 border-4 border-black border-t-transparent"></div>
                                <p className="text-xs text-gray-400 mt-2">جاري الاتصال بالسحابة وتحميل المعرض...</p>
                            </div>
                        ) : filteredPortfolio.length === 0 ? (
                            <div className="text-center py-16 bg-white rounded-2xl border border-dashed border-gray-300">
                                <i data-lucide="image" className="w-10 h-10 mx-auto text-gray-300 mb-2"></i>
                                <p className="text-gray-500 text-sm">لا توجد تصاميم مضافة حالياً.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {filteredPortfolio.map((item) => (
                                    <div key={item.id} className="bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-md transition-all group relative">
                                        <div className="h-56 bg-gray-100 overflow-hidden relative">
                                            <img 
                                                src={item.image} 
                                                alt={item.title} 
                                                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                                                loading="lazy"
                                            />
                                            <span className="absolute top-3 right-3 bg-black/60 backdrop-blur-md text-white text-[10px] px-2.5 py-1 rounded-full">
                                                {item.category}
                                            </span>
                                            {isAuthenticated && (
                                                <button 
                                                    onClick={() => handleDeleteItem(item.id)}
                                                    className="absolute top-3 left-3 bg-red-600 hover:bg-red-700 text-white p-1.5 rounded-full transition-colors"
                                                    title="حذف التصميم"
                                                >
                                                    <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                                </button>
                                            )}
                                        </div>
                                        <div className="p-4">
                                            <h3 className="font-bold text-gray-800 text-base mb-1">{item.title}</h3>
                                            {item.desc && <p className="text-xs text-gray-500 line-clamp-2">{item.desc}</p>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t border-gray-200 py-6 mt-12">
                        <div className="max-w-6xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between text-xs text-gray-500 gap-4">
                            <p>© 2026 ES Agency. جميع الحقوق محفوظة.</p>
                            <button 
                                onClick={() => setIsAdminOpen(true)}
                                className="flex items-center gap-1 text-gray-400 hover:text-black transition-colors"
                            >
                                <i data-lucide={isAuthenticated ? "unlock" : "lock"} className="w-3 h-3"></i>
                                <span>{isAuthenticated ? "الوضع مفتوح" : "دخول المشرف"}</span>
                            </button>
                        </div>
                    </footer>

                    {/* Admin Modal */}
                    {isAdminOpen && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
                                <button 
                                    onClick={() => setIsAdminOpen(false)}
                                    className="absolute top-4 left-4 text-gray-400 hover:text-black"
                                >
                                    <i data-lucide="x" className="w-4 h-4"></i>
                                </button>

                                {!isAuthenticated ? (
                                    /* نموذج الدخول السري */
                                    <form onSubmit={handleAdminLogin} className="text-center py-2">
                                        <div className="w-8 h-8 rounded-full bg-black text-white flex items-center justify-center mx-auto mb-3">
                                            <i data-lucide="lock" className="w-3.5 h-3.5"></i>
                                        </div>
                                        <h3 className="font-bold text-gray-900 text-lg mb-1">دخول المشرف</h3>
                                        <p className="text-xs text-gray-400 mb-4">ادخل الرمز السري لإظهار خيارات التزويد والحذف</p>
                                        
                                        <input 
                                            type="password" 
                                            value={passcode}
                                            onChange={(e) => setPasscode(e.target.value)}
                                            placeholder="ادخل رمز المرور"
                                            className="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-center text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-black"
                                            autoFocus
                                        />
                                        <button type="submit" className="w-full bg-black text-white font-medium py-2.5 rounded-xl text-xs hover:bg-gray-800 transition-colors">
                                            تأكيد الدخول
                                        </button>
                                    </form>
                                ) : (
                                    /* نموذج إضافة تصميم جديد */
                                    <div>
                                        <div className="flex items-center justify-between mb-4 border-b border-gray-100 pb-3">
                                            <h3 className="font-bold text-gray-900 text-base">إضافة تصميم جديد</h3>
                                            <button 
                                                onClick={() => setIsAuthenticated(false)}
                                                className="text-[11px] text-red-500 hover:underline"
                                            >
                                                تسجيل خروج
                                            </button>
                                        </div>

                                        <form onSubmit={handleAddPortfolio} className="space-y-3">
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-700 mb-1">عنوان التصميم</label>
                                                <input 
                                                    type="text" 
                                                    value={newItemTitle}
                                                    onChange={(e) => setNewItemTitle(e.target.value)}
                                                    placeholder="مثال: تصميم شعار شركة..."
                                                    className="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-black"
                                                    required
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-xs font-semibold text-gray-700 mb-1">القسم</label>
                                                <select 
                                                    value={newItemCategory}
                                                    onChange={(e) => setNewItemCategory(e.target.value)}
                                                    className="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-black"
                                                >
                                                    <option value="تصميم">تصميم</option>
                                                    <option value="برمجة">برمجة</option>
                                                    <option value="فيديو">فيديو</option>
                                                </select>
                                            </div>

                                            <div>
                                                <label className="block text-xs font-semibold text-gray-700 mb-1">الوصف (اختياري)</label>
                                                <textarea 
                                                    value={newItemDesc}
                                                    onChange={(e) => setNewItemDesc(e.target.value)}
                                                    placeholder="اكتب وصفاً قصيراً..."
                                                    className="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-black h-16 resize-none"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-xs font-semibold text-gray-700 mb-1">صورة التصميم</label>
                                                <input 
                                                    type="file" 
                                                    accept="image/*"
                                                    onChange={handleImageFileChange}
                                                    className="w-full text-xs text-gray-500 border border-gray-300 rounded-xl p-2 cursor-pointer"
                                                    required
                                                />
                                            </div>

                                            <button 
                                                type="submit" 
                                                disabled={uploading}
                                                className="w-full bg-black text-white font-medium py-2.5 rounded-xl text-xs hover:bg-gray-800 transition-colors mt-2 flex items-center justify-center gap-2"
                                            >
                                                {uploading ? (
                                                    <>
                                                        <div className="animate-spin rounded-full h-3.5 w-3.5 border-2 border-white border-t-transparent"></div>
                                                        <span>جاري الرفع إلى Firebase...</span>
                                                    </>
                                                ) : (
                                                    <span>رفع التصميم للموقع</span>
                                                )}
                                            </button>
                                        </form>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>
